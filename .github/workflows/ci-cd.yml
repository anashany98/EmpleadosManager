name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # Job 1: Lint and Type Check (frontend & backend)
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    strategy:
      matrix:
        component: [backend, frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            ${{ matrix.component }}/package-lock.json

      - name: Install dependencies
        run: |
          cd ${{ matrix.component }}
          npm ci

      - name: Run ESLint
        if: matrix.component == 'backend'
        run: |
          cd backend
          npm run lint

      - name: Run ESLint
        if: matrix.component == 'frontend'
        run: |
          cd frontend
          npm run lint

      - name: TypeScript type check
        if: matrix.component == 'backend'
        run: |
          cd backend
          npx tsc --noEmit

      - name: TypeScript type check (frontend)
        if: matrix.component == 'frontend'
        run: |
          cd frontend
          npx tsc --noEmit

  # Job 2: Backend Tests with Coverage
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: |
          cd backend
          npm ci

      - name: Generate Prisma Client
        # MED-003: usar el script npm `prisma:generate` (que pasa
        # `--schema=../database/prisma/schema.prisma` y compone la
        # DATABASE_URL desde el .env) en vez de `npx prisma`
        # directo, que busca el schema en `./prisma/schema.prisma`
        # y falla con "Could not find Prisma Schema" desde
        # `backend/`.
        run: |
          cd backend
          npm run prisma:generate

      - name: Setup test database
        # MED-003: aplicar migraciones con el script npm
        # `prisma:migrate:deploy` (que pasa `--schema` y la URL).
        # `validate` y `migrate status` confirman que el schema es
        # coherente y que no hay drift.
        run: |
          cd backend
          npm run prisma:validate
          npm run prisma:migrate:deploy
          npm run prisma:status
        env:
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/test_db

      - name: Run tests with coverage
        run: |
          cd backend
          npm run test:coverage
        env:
          JWT_SECRET: test-jwt-secret-for-ci
          ENCRYPTION_KEY: 12345678901234567890123456789012
          NODE_ENV: test
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/test_db
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          COOKIE_SECURE: false
          COOKIE_SAMESITE: lax
          RETURN_TOKENS: false

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage/*.json
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false

  # Job 3: Frontend Tests
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run tests
        run: |
          cd frontend
          npm run test:coverage -- --run
        env:
          VITE_API_URL: http://localhost:3000/api

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./frontend/coverage/*.json
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: false

  # Job 4: Frontend Build (HIGH-006)
  # Antes solo había `tsc --noEmit` y los tests. Vite puede
  # detectar problemas que tsc no (resolución de exports,
  # tree-shaking, etc.). Si esto falla, el artefacto desplegable
  # no se puede generar.
  frontend-build:
    name: Frontend Build (HIGH-006)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Build (vite)
        run: |
          cd frontend
          npm run build

  # Job 5: Build Docker Images
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs:
      [
        lint-and-typecheck,
        backend-tests,
        frontend-tests,
        security-guardrails,
        frontend-build,
        nginx-config-validate,
      ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub (optional)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        continue-on-error: true

      - name: Build and push backend image
        if: github.event_name != 'pull_request'
        run: |
          docker build -f backend/Dockerfile -t ${{ secrets.DOCKERHUB_USERNAME }}/rrhh-backend:${{ github.sha }} -t ${{ secrets.DOCKERHUB_USERNAME }}/rrhh-backend:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/rrhh-backend:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/rrhh-backend:latest

      - name: Build and push frontend image
        if: github.event_name != 'pull_request'
        run: |
          docker build -f frontend/Dockerfile -t ${{ secrets.DOCKERHUB_USERNAME }}/rrhh-frontend:${{ github.sha }} -t ${{ secrets.DOCKERHUB_USERNAME }}/rrhh-frontend:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/rrhh-frontend:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/rrhh-frontend:latest

      - name: Build images (PR only - no push)
        if: github.event_name == 'pull_request'
        run: |
          docker build -f backend/Dockerfile -t rrhh-backend:${{ github.sha }} .
          docker build -f frontend/Dockerfile -t rrhh-frontend:${{ github.sha }} .

  security-guardrails:
    name: Security Guardrails (HIGH-011 et al.)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Block seed-admin-inline.js reintroduction (HIGH-011)
        run: |
          if [ -f scripts/seed-admin-inline.js ]; then
            echo "::error::HIGH-011: scripts/seed-admin-inline.js reintroduced. Use backend/src/scripts/seed-admin.ts with SEED_ADMIN_PASSWORD env var instead."
            exit 1
          fi

      - name: Scan for hardcoded password fallbacks (HIGH-011)
        run: |
          # Detecta patrones peligrosos: literal de contraseña (>=6 chars
          # de letras/dígitos/símbolos) encadenado con || o ?? a una
          # variable de entorno. Excluye sentinels explícitos.
          PATTERN='(CHANGE_ME|REPLACE_ME|YOUR_PASSWORD|EXAMPLE|SET_ME|PLACEHOLDER)'
          DANGEROUS='\|\|\s*['\''"][A-Za-z0-9!@#$%^&*()_+=\-]{6,}['\''"]|\?\?\s*['\''"][A-Za-z0-9!@#$%^&*()_+=\-]{6,}['\''"]'
          HITS=$(grep -rEn --include='*.js' --include='*.ts' "$DANGEROUS" scripts/ backend/src/scripts/ 2>/dev/null \
            | grep -viE "$PATTERN" || true)
          if [ -n "$HITS" ]; then
            echo "::error::HIGH-011: scripts inseguros con fallback de contraseña hardcodeado detectado"
            echo "$HITS"
            exit 1
          fi
          echo "OK: ningún script con fallback de contraseña hardcodeado"

  # MED-008: validar que la config de nginx se renderiza
  # correctamente y que pasa `nginx -t` en AMBAS topologías
  # (proxy con SSL + frontend con reverse proxy a /api). Antes
  # el conf montado tenía `${DOMAIN_NAME:-localhost}` (sintaxis
  # bash) que nginx no entiende y rompía server_name en silencio.
  # Ahora el template usa `$DOMAIN_NAME` (estándar de envsubst) y
  # se procesa con el entrypoint oficial de la imagen
  # `nginx:1.25-alpine`.
  nginx-config-validate:
    name: Nginx Config Validate (MED-008)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Render the reverse proxy template with envsubst
        env:
          DOMAIN_NAME: test.example.com
        run: |
          set -euo pipefail
          mkdir -p /tmp/nginx-test/conf.d
          # Renderizar el template con un DOMAIN_NAME de prueba
          # (debe ser sintácticamente válido aunque no resuelva
          # en DNS). En el contenedor oficial, envsubst hace
          # exactamente lo mismo.
          envsubst < nginx/templates/default.conf.template \
            > /tmp/nginx-test/conf.d/default.conf
          echo "--- Rendered default.conf (head) ---"
          head -30 /tmp/nginx-test/conf.d/default.conf
          echo "--- server_name lines (should be 2 with DOMAIN_NAME) ---"
          grep -nE 'server_name' /tmp/nginx-test/conf.d/default.conf
          # Sanity check: el template NO debe contener la
          # sintaxis bash `${VAR:-default}` (que nginx no
          # entiende y rompería el render).
          if grep -qE '\$\{[A-Z_]+\:-' /tmp/nginx-test/conf.d/default.conf; then
            echo "::error::MED-008: el template renderizado contiene '\${VAR:-default}' (sintaxis bash no soportada por nginx)"
            exit 1
          fi
          echo "OK: el render no contiene sintaxis bash"

      - name: Validate the rendered reverse proxy config with nginx -t
        run: |
          set -euo pipefail
          # Crear un nginx.conf minimalista + certs dummy para
          # que `nginx -t` solo falle por syntax errors, no por
          # cosas de runtime (bind, SSL handshake, etc.).
          mkdir -p /tmp/nginx-test/ssl
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout /tmp/nginx-test/ssl/privkey.pem \
            -out /tmp/nginx-test/ssl/fullchain.pem \
            -days 1 -subj '/CN=test' 2>/dev/null
          # Renderizar el conf principal del repo (rate limits,
          # gzip, etc.) tal como quedaría montado.
          cat > /tmp/nginx-test/nginx.conf <<'EOF'
          user  nginx;
          worker_processes  1;
          error_log  /tmp/nginx-test/error.log warn;
          pid        /tmp/nginx-test/nginx.pid;
          events {
              worker_connections  1024;
          }
          http {
              include       /etc/nginx/mime.types;
              default_type  application/octet-stream;
              sendfile      on;
              keepalive_timeout  65;
              limit_req_status 429;
              limit_req_zone $binary_remote_addr zone=api:1m rate=10r/s;
              limit_req_zone $binary_remote_addr zone=login:1m rate=3r/s;
              include /tmp/nginx-test/conf.d/*.conf;
          }
          EOF
          # Usar un container efímero de nginx:alpine para
          # validar (la imagen ya trae envsubst, gettext, etc.).
          docker run --rm \
            -v /tmp/nginx-test:/tmp/nginx-test:ro \
            -v /tmp/nginx-test/conf.d:/etc/nginx/conf.d:ro \
            nginx:1.25-alpine \
            sh -c 'nginx -t -c /tmp/nginx-test/nginx.conf'
          echo "OK: nginx -t pasó sobre el template renderizado"

      - name: Validate the frontend nginx.conf (static SPA, no SSL)
        run: |
          set -euo pipefail
          mkdir -p /tmp/nginx-frontend-test/conf.d /tmp/nginx-frontend-test/html
          cp frontend/nginx.conf /tmp/nginx-frontend-test/conf.d/frontend.conf
          # frontend/nginx.conf referencia `http://backend:3000`
          # en producción; para `nginx -t` no hace falta que
          # resuelva (es solo un upstream name literal), pero
          # si el parse falla lo veríamos.
          cat > /tmp/nginx-frontend-test/nginx.conf <<'EOF'
          user  nginx;
          worker_processes  1;
          error_log  /tmp/nginx-frontend-test/error.log warn;
          pid        /tmp/nginx-frontend-test/nginx.pid;
          events {
              worker_connections  1024;
          }
          http {
              include       /etc/nginx/mime.types;
              default_type  application/octet-stream;
              sendfile      on;
              keepalive_timeout  65;
              include /tmp/nginx-frontend-test/conf.d/*.conf;
          }
          EOF
          docker run --rm \
            -v /tmp/nginx-frontend-test:/tmp/nginx-frontend-test:ro \
            -v /tmp/nginx-frontend-test/conf.d:/etc/nginx/conf.d:ro \
            nginx:1.25-alpine \
            sh -c 'nginx -t -c /tmp/nginx-frontend-test/nginx.conf'
          echo "OK: frontend nginx.conf válido"

  # Job 5: Security Scanning
  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@27b0417c16317ca9a472a9a8092acce143b49c55 # v3.95.9
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

      # npm audit: surface known vulnerable packages. Runs for BOTH
      # backend and frontend. We only fail the build on HIGH or
      # CRITICAL vulnerabilities in production dependencies
      # (--omit=dev). Dev-time vulnerabilities are reported but
      # non-blocking because they don't ship to the user.
      - name: npm audit (backend production deps)
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: false

      - name: npm audit (frontend production deps)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: false

      - name: npm audit (root workspace deps)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: false

  # Job 6: Deploy to Coolify (only on push to main)
  deploy:
    name: Deploy to Coolify
    runs-on: ubuntu-latest
    needs: [build, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Coolify via Webhook
        run: |
          curl -X POST ${{ secrets.COOLIFY_WEBHOOK_URL }}
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
