server {
    listen 80;

    include /etc/nginx/mime.types;

    types {
        application/javascript mjs;
    }

    # MED-008: security headers en TODAS las respuestas del
    # frontend. Importante cuando el contenedor se expone
    # directamente (topología Coolify/Traefik sin el reverse
    # proxy `nginx-proxy` delante). El nginx-proxy de
    # `docker-compose.yml` ya añade un CSP más estricto, pero
    # este nginx del frontend debe tener al menos los básicos
    # por si se accede directamente al contenedor.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    # CSP conservador para una SPA. `unsafe-inline` + `unsafe-eval`
    # se necesitan por cómo Vite emite los chunks en runtime;
    # tighten cuando se introduzca un nonce/hash-based CSP.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' wss: https:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

# Same-origin API proxy. In local docker-compose the backend is reachable
     # as the "backend" service on the internal network; in Coolify/Traefik
     # deployments, change this to the public backend URL.
     location /api/ {
         proxy_pass http://backend:3000/api/;
         proxy_http_version 1.1;
         proxy_set_header Host $host;
         proxy_set_header X-Real-IP $remote_addr;
         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
         proxy_set_header X-Forwarded-Proto $scheme;
         proxy_buffer_size 16k;
         proxy_buffers 4 16k;
         proxy_busy_buffers_size 32k;
     }

     location /socket.io/ {
         proxy_pass http://backend:3000/socket.io/;
         proxy_http_version 1.1;
         proxy_set_header Host $host;
         proxy_set_header X-Real-IP $remote_addr;
         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
         proxy_set_header X-Forwarded-Proto $scheme;
         proxy_set_header Upgrade $http_upgrade;
         proxy_set_header Connection "upgrade";
         proxy_buffer_size 16k;
         proxy_buffers 4 16k;
     }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Do not probe directories here. The SPA route `/assets` has the same
        # name as Vite's physical asset directory; `$uri/` made Nginx select
        # that directory and return 403 instead of handing the route to React.
        # Real JS/CSS files still resolve through `$uri`.
        try_files $uri /index.html;
    }
}
