server {
    listen 80;

    include /etc/nginx/mime.types;

    types {
        application/javascript mjs;
    }

# Same-origin API proxy. Routes browser calls through the public Traefik
     # URL of the backend. This works in Coolify because both apps are on
     # the same Docker network and Traefik routes by Host header.
     location /api/ {
         proxy_pass https://api.empleadosmanager.egeadev.cloud/api/;
         proxy_http_version 1.1;
         proxy_ssl_server_name on;
         proxy_set_header Host api.empleadosmanager.egeadev.cloud;
         proxy_set_header X-Real-IP $remote_addr;
         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
         proxy_set_header X-Forwarded-Proto https;
         # Avoid "upstream sent too big header" with large CSP / Set-Cookie headers
         proxy_buffer_size 16k;
         proxy_buffers 4 16k;
         proxy_busy_buffers_size 32k;
     }

     location /socket.io/ {
         proxy_pass https://api.empleadosmanager.egeadev.cloud/socket.io/;
         proxy_http_version 1.1;
         proxy_ssl_server_name on;
         proxy_set_header Host api.empleadosmanager.egeadev.cloud;
         proxy_set_header X-Real-IP $remote_addr;
         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
         proxy_set_header X-Forwarded-Proto https;
         proxy_set_header Upgrade $http_upgrade;
         proxy_set_header Connection "upgrade";
         proxy_buffer_size 16k;
         proxy_buffers 4 16k;
     }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}
