<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#1d4ed8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!--
    Content Security Policy. The service worker registration is moved to
    /public/sw-register.js (an external file) so we no longer need any
    'unsafe-inline' script or sha256 hash here. The CSP sent by the Express
    backend (via Helmet) is the source of truth; this meta tag acts as a
    defense-in-depth measure for the static shell before any backend response.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' ws: wss: https://api.empleadosmanager.egeadev.cloud; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self';" />
  <title>Empleados Manager APP</title>
  <link rel="apple-touch-icon" href="/icons/icon-192.svg" />
  <script type="module" src="/sw-register.js"></script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
