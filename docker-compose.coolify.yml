services:
  postgres:
    image: postgres:15.4-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_INITDB_ARGS: ""
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - manager_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      postgres
      -cwal_level=replica
      -carchive_mode=on
      -carchive_command=/bin/true
      -cmax_wal_senders=3
      -cwal_keep_size=1GB

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    networks:
      - manager_network
    command: >
      sh -c 'if [ -z "$$REDIS_PASSWORD" ]; then echo "REDIS_PASSWORD is required"; exit 1; fi;
      exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --save 900 1 --save 300 10 --save 60 10000'
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - FOWNER
      - SETGID
      - SETUID
    environment:
      - NODE_ENV=production
      - RUN_PRISMA_MIGRATIONS=true
      - DATABASE_URL=postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?schema=public&connection_limit=20&pool_timeout=15&connection_timeout=10
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      - KIOSK_DEVICE_SECRET=${KIOSK_DEVICE_SECRET:-}
      - CORS_ORIGIN=${CORS_ORIGIN:?CORS_ORIGIN is required}
      - FRONTEND_URL=${FRONTEND_URL:?FRONTEND_URL is required}
      - COOKIE_SECURE=true
      - COOKIE_DOMAIN=${COOKIE_DOMAIN:-}
      - COOKIE_SAMESITE=${COOKIE_SAMESITE:-lax}
      - RETURN_TOKENS=false
      - CSRF_COOKIE_NAME=${CSRF_COOKIE_NAME:-}
      - CSRF_HEADER_NAME=${CSRF_HEADER_NAME:-}
      - CSRF_MAX_AGE_MS=${CSRF_MAX_AGE_MS:-}
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-local}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_REGION=${S3_REGION:-}
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      - BACKUP_UPLOAD=${BACKUP_UPLOAD:-}
      - BACKUP_ENCRYPTION_KEY=${BACKUP_ENCRYPTION_KEY:?BACKUP_ENCRYPTION_KEY is required}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - PRISMA_QUERY_TIMEOUT=10000
      - PRISMA_CONNECT_TIMEOUT=10000
      - OCR_POOL_SIZE=${OCR_POOL_SIZE:-1}
      - OCR_TIMEOUT_MS=${OCR_TIMEOUT_MS:-60000}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_RELEASE=${SENTRY_RELEASE:-}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-production}
    volumes:
      - backend_uploads:/app/backend/uploads
      - backend_data:/app/backend/data
      - backend_backups:/app/backend/backups
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - manager_network
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/api/health/liveness', r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-}
    restart: unless-stopped
    expose:
      - "80"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    depends_on:
      - backend
    networks:
      - manager_network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  backup:
    image: prodrigestivill/postgres-backup-local:15
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=${POSTGRES_DB:?POSTGRES_DB is required}
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER is required}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - SCHEDULE=${BACKUP_SCHEDULE:-0 2 * * *}
      - BACKUP_KEEP_DAYS=${BACKUP_RETENTION_DAYS:-30}
      - BACKUP_KEEP_WEEKS=${BACKUP_KEEP_WEEKS:-4}
      - BACKUP_KEEP_MONTHS=${BACKUP_KEEP_MONTHS:-6}
      - HEALTHCHECK_PORT=8080
    volumes:
      - backup_data:/backups
      - backend_uploads:/backups/uploads:ro
      - backend_data:/backups/backend-data:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - manager_network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 5m

networks:
  manager_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
  backend_data:
  backend_backups:
  backup_data:
