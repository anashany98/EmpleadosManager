services:
  # Base de Datos PostgreSQL
  postgres:
    image: postgres:15.4-alpine
    container_name: manager_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: ""
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - manager_network
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      postgres
      -cwal_level=replica
      -carchive_mode=on
      -carchive_command=/bin/true
      -cmax_wal_senders=3
      -cwal_keep_size=1GB

  # Redis (Queue & Cache) con persistencia
  redis:
    image: redis:7.2-alpine
    container_name: manager_redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - manager_network
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    command: >
      sh -c 'if [ -z "$$REDIS_PASSWORD" ]; then echo "REDIS_PASSWORD is required"; exit 1; fi;
      exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --save 900 1 --save 300 10 --save 60 10000'
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend (Node.js API)
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: manager_backend
    ports:
      - "127.0.0.1:16161:3000"
    environment:
      - NODE_ENV=${NODE_ENV:?NODE_ENV is required}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB}?schema=public&connection_timeout=10
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      - KIOSK_DEVICE_SECRET=${KIOSK_DEVICE_SECRET:-}
      - CORS_ORIGIN=${CORS_ORIGIN:?CORS_ORIGIN is required}
      - FRONTEND_URL=${FRONTEND_URL:?FRONTEND_URL is required}
      - COOKIE_SECURE=${COOKIE_SECURE:?COOKIE_SECURE is required}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN}
      - COOKIE_SAMESITE=${COOKIE_SAMESITE}
      - RETURN_TOKENS=false
      - CSRF_COOKIE_NAME=${CSRF_COOKIE_NAME}
      - CSRF_HEADER_NAME=${CSRF_HEADER_NAME}
      - CSRF_MAX_AGE_MS=${CSRF_MAX_AGE_MS}
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-local}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_REGION=${S3_REGION}
      - S3_BUCKET=${S3_BUCKET}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - BACKUP_UPLOAD=${BACKUP_UPLOAD}
      - BACKUP_ENCRYPTION_KEY=${BACKUP_ENCRYPTION_KEY:?BACKUP_ENCRYPTION_KEY is required}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - PRISMA_QUERY_TIMEOUT=10000
      - PRISMA_CONNECT_TIMEOUT=10000
    volumes:
      - backend_uploads:/app/backend/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - manager_network
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/api/health/liveness', r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5

  # Frontend (Vite React - Nginx)
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL}
    container_name: manager_frontend
    ports:
      - "127.0.0.1:17171:80"
    depends_on:
      - backend
    networks:
      - manager_network
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s



  # Nginx Reverse Proxy with SSL support
  nginx-proxy:
    image: nginx:1.25-alpine
    container_name: manager_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certbot-webroot:/var/www/certbot:ro  # Let's Encrypt ACME challenges
      - ./nginx/ssl/letsencrypt:/etc/letsencrypt:ro   # Let's Encrypt certificates
    depends_on:
      - frontend
      - backend
    networks:
      - manager_network
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
# Backup Service - Automated PostgreSQL backups with S3 upload
  backup:
    image: prodrigestivill/postgres-backup-local:15
    container_name: manager_backup
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - SCHEDULE=${BACKUP_SCHEDULE:-0 2 * * *}
      - BACKUP_KEEP_DAYS=${BACKUP_RETENTION_DAYS:-30}
      - BACKUP_KEEP_WEEKS=${BACKUP_KEEP_WEEKS:-4}
      - BACKUP_KEEP_MONTHS=${BACKUP_KEEP_MONTHS:-6}
      - HEALTHCHECK_PORT=8080
      # S3 Backup Configuration
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_BUCKET=${BACKUP_S3_BUCKET:-}
      - BACKUP_S3_ENABLED=${BACKUP_S3_ENABLED:-false}
    volumes:
      - backup_data:/backups
      - backend_uploads:/backups/uploads:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - manager_network
    restart: unless-stopped
    healthcheck:
      # prodrigestivill/postgres-backup-local exposes an HTTP health endpoint
      # on HEALTHCHECK_PORT (8080). It returns the timestamp of the last
      # successful backup. If more than 36h have passed since the last
      # successful backup, Docker will mark the service as unhealthy.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 5m

  # Off-site backup to OneDrive (Microsoft 365) via rclone sidecar.
  # The "backup" container writes pg_dumps to the backup_data volume daily;
  # this sidecar mirrors that volume to OneDrive every 24h, satisfying the
  # 3-2-1 backup rule (3 copies, 2 media, 1 off-site).
  #
  # One-time setup: run scripts/setup-onedrive.sh to create the rclone.conf
  # (interactive OAuth in browser). Until that is done, this container waits
  # patiently (no restart storm) and stays unhealthy.
  #
  # To disable OneDrive entirely, comment out this whole service block.
  rclone-onedrive:
    image: rclone/rclone:1
    container_name: manager_rclone_onedrive
    environment:
      - ONEDRIVE_REMOTE=${ONEDRIVE_REMOTE:-onedrive}
      - ONEDRIVE_PATH=${ONEDRIVE_PATH:-rrhh-backups}
    command: >
      sh -c "
      echo '[rclone] Esperando a /config/rclone/rclone.conf...';
      while [ ! -f /config/rclone/rclone.conf ]; do
        sleep 60;
      done;
      echo '[rclone] rclone.conf detectado, arrancando sync loop (cada 24h)';
      while true; do
        echo \"[rclone] sync started at $$(date -Iseconds)\";
        rclone sync /data \"\$$ONEDRIVE_REMOTE:\$$ONEDRIVE_PATH\"
          --log-level INFO
          --log-file /logs/rclone.log
          --use-json-log
          --stats 5m
          --transfers 4
          --checkers 8
          --delete-during
          --retries 3
          --low-level-retries 10
          && touch /logs/last-sync;
        echo \"[rclone] sync finished at $$(date -Iseconds), next in 24h\";
        sleep 86400;
      done"
    volumes:
      - rclone_config:/config/rclone:ro
      - backup_data:/data:ro
      - rclone_logs:/logs
    networks:
      - manager_network
    depends_on:
      backup:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # Falla si el ultimo sync exitoso tiene >25h de antiguedad (24h + buffer).
      # El marker /logs/last-sync solo se toca cuando rclone sync termina con exito.
      test: ["CMD-SHELL", "test -f /logs/last-sync && find /logs/last-sync -mmin -1500 | grep -q ."]
      interval: 1h
      timeout: 5s
      retries: 2
      start_period: 1h

networks:
  manager_network:
    driver: bridge
  coolify:
    # Optional: only needed when deploying via Coolify.
    # Create manually with: docker network create coolify
    # Remove this block if not using Coolify.
    external: true

volumes:
  backup_data:
    driver: local
  postgres_data:
  backend_uploads:
  redis_data:
  rclone_config:
    # Persistent rclone config (created by scripts/setup-onedrive.sh).
    driver: local
  rclone_logs:
    # rclone sidecar logs + last-sync marker file. Not persistent: rotated
    # on container recreate. For long-term audit, use a log shipper.
    driver: local




