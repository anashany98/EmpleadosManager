services:
  # Base de Datos PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: manager_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: ""
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - manager_network
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      postgres
      -cwal_level=replica
      -carchive_mode=on
      -carchive_command=/bin/true
      -cmax_wal_senders=3
      -cwal_keep_size=1GB

  # Redis (Queue & Cache) con persistencia
  redis:
    image: redis:7-alpine
    container_name: manager_redis
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - manager_network
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    command: redis-server --appendonly yes --save 900 1 --save 300 10 --save 60 10000
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend (Node.js API)
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: manager_backend
    ports:
      - "127.0.0.1:16161:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public&connection_timeout=10
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - KIOSK_DEVICE_SECRET=${KIOSK_DEVICE_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - FRONTEND_URL=${FRONTEND_URL}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN}
      - COOKIE_SAMESITE=${COOKIE_SAMESITE}
      - CSRF_COOKIE_NAME=${CSRF_COOKIE_NAME}
      - CSRF_HEADER_NAME=${CSRF_HEADER_NAME}
      - CSRF_MAX_AGE_MS=${CSRF_MAX_AGE_MS}
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-local}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_REGION=${S3_REGION}
      - S3_BUCKET=${S3_BUCKET}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - BACKUP_UPLOAD=${BACKUP_UPLOAD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PRISMA_QUERY_TIMEOUT=10000
      - PRISMA_CONNECT_TIMEOUT=10000
    volumes:
      - backend_uploads:/app/backend/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - manager_network
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/api/health', r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5

  # Frontend (Vite React - Nginx)
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL}
    container_name: manager_frontend
    ports:
      - "127.0.0.1:17171:80"
    depends_on:
      - backend
    networks:
      - manager_network
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M



  # Nginx Reverse Proxy with SSL support
  nginx-proxy:
    image: nginx:alpine
    container_name: manager_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certbot-webroot:/var/www/certbot:ro  # Let's Encrypt ACME challenges
      - ./nginx/ssl/letsencrypt:/etc/letsencrypt:ro   # Let's Encrypt certificates
    depends_on:
      - frontend
      - backend
    networks:
      - manager_network
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
  # Backup Service - Automated PostgreSQL backups
  backup:
    image: prodrigestivill/postgres-backup-local:15
    container_name: manager_backup
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - SCHEDULE=${BACKUP_SCHEDULE:-0 2 * * *}
      - BACKUP_KEEP_DAYS=${BACKUP_RETENTION_DAYS:-30}
      - BACKUP_KEEP_WEEKS=4
      - BACKUP_KEEP_MONTHS=6
      - HEALTHCHECK_PORT=8080
    volumes:
      - backup_data:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - manager_network
    restart: unless-stopped

networks:
  manager_network:
    driver: bridge
  coolify:
    external: true

volumes:
  backup_data:
    driver: local
  postgres_data:
  backend_uploads:
  redis_data:




