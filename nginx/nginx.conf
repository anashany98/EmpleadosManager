user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    map $host $api_limit_key {
        default $binary_remote_addr;
        localhost "";
        127.0.0.1 "";
        [::1] "";
    }

    map $host $login_limit_key {
        default $binary_remote_addr;
        localhost "";
        127.0.0.1 "";
        [::1] "";
    }

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    # Security headers (applied globally, overridden in server blocks if needed)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS is set per-server-block so it only applies when SSL is active

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    limit_req_status 429;
    limit_req_zone $api_limit_key zone=api:10m rate=10r/s;
    limit_req_zone $login_limit_key zone=login:10m rate=3r/s;

    include /etc/nginx/conf.d/*.conf;
}
